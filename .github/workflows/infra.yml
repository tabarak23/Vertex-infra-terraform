name: terraform-infra

on:
  push:
    branches:
      - dev
      - staging
      - production
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/infra.yml"

  pull_request:
    branches:
      - dev
      - staging
      - production

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: 1.6.6
  AWS_REGION: us-west-1

jobs:

    plan:
      name: Terraform Plan
      runs-on: ubuntu-latest

      outputs:
        tfplan-path: ${{ steps.plan.outputs.planfile }}

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set Environment Folder
          id: env
          run: |
            if [[ "${GITHUB_REF##*/}" == "production" ]]; then
              echo "dir=environments/prod" >> $GITHUB_OUTPUT
            else
              echo "dir=environments/${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
            fi

        - name: Configure AWS Credentials (OIDC)
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: ${{ env.TF_VERSION }}


        - name: Terraform Format Check
          run: terraform fmt -check -recursive

        - name: Setup TFLint
          uses: terraform-linters/setup-tflint@v4

        - name: Run TFLint
          run: |
            tflint --init
            tflint -f compact

       # - name: Run tfsec Security Scan
        #  uses: aquasecurity/tfsec-action@v1.0.3
         # with:
          #  working_directory: ${{ steps.env.outputs.dir }}
           # format: sarif
           # additional_args: >
           #   --tfvars-file=${{ steps.env.outputs.dir }}/terraform.tfvars
           #   --minimum-severity HIGH
           #   --out=tfsec.sarif


        #- name: Upload tfsec SARIF
        #  uses: github/codeql-action/upload-sarif@v3
        #  with:
        #    sarif_file: tfsec.sarif

        - name: Terraform Init
          working-directory: ${{ steps.env.outputs.dir }}
          run: terraform init -input=false

        - name: Terraform Validate
          working-directory: ${{ steps.env.outputs.dir }}
          run: terraform validate

        - name: Terraform Plan
          id: plan
          working-directory: ${{ steps.env.outputs.dir }}
          run: |
            terraform plan -no-color -input=false \
              -out=tfplan.binary
            echo "planfile=${{ steps.env.outputs.dir }}/tfplan.binary" >> $GITHUB_OUTPUT

        - name: Upload Plan Artifact
          uses: actions/upload-artifact@v4
          with:
            name: terraform-plan
            path: ${{ steps.env.outputs.dir }}/tfplan.binary
            retention-days: 1


    apply:
      name: Terraform Apply
      runs-on: ubuntu-latest
      needs: plan
      if: github.event_name == 'push'


      environment:
        name: ${{ github.ref_name }}

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set Environment Folder
          id: env
          run: |
            if [[ "${GITHUB_REF##*/}" == "production" ]]; then
              echo "dir=environments/prod" >> $GITHUB_OUTPUT
            else
              echo "dir=environments/${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
            fi

        - name: Configure AWS Credentials (OIDC)
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: ${{ env.TF_VERSION }}

        - name: Download Plan
          uses: actions/download-artifact@v4
          with:
            name: terraform-plan
            path: ${{ steps.env.outputs.dir }}

        - name: Terraform Init
          working-directory: ${{ steps.env.outputs.dir }}
          run: terraform init -input=false

        - name: Terraform Destroy
          working-directory: ${{ steps.env.outputs.dir }}
          run: terraform destroy -auto-approve